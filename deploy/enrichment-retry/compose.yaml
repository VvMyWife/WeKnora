services:
  app:
    image: ${ENRICHMENT_APP_IMAGE:-weknora-app:enrichment-retry-20261016}
    environment:
      ARCHIVE_MAPPING_LOG_DIR: null
    # Match the running container; do not activate unrelated pending mounts.
    volumes: !override
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml
      - ./skills/preloaded:/app/skills/preloaded
      - /var/run/docker.sock:/var/run/docker.sock
