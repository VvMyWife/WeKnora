services:
  app:
    image: ${ENRICHMENT_APP_IMAGE:-weknora-app:external-chunks-20261016}
    environment:
      ARCHIVE_MAPPING_LOG_DIR: /app/data/processing-logs
    # Preserve enrichment deployment mounts and persist archive batch logs.
    volumes: !override
      - data-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - ./config/config.yaml:/app/config/config.yaml
      - ./skills/preloaded:/app/skills/preloaded
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/processing-logs:/app/data/processing-logs
